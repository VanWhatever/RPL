<!DOCTYPE html>
<html>
    <head>
        <title>Praktek Tabel</title>
    </head>
    <body>
        <h2>Tabel Nilai</h2>  
        <table border="1">
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Alice</td>
                <td>90</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bob</td>
                <td>85</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Charlie</td>
                <td>92</td>
            </tr>
        </table>
<hr>
<table border="1"
>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="3">Nilai</th>
            </tr>
            <tr>
                <th>Matematika</th>
                <th>Bahasa Indonesia</th>
                <th>Produktif</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Alice</td>
                <td>90</td>
                <td>85</td>
                <td>88</td>
            </tr>    
        </table>
    </body>
</html>
